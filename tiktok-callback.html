<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting · Sports Receipts</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="doc">
  <div class="head"><img src="penny.png" alt="" width="64" height="64"><div><h1>Connecting…</h1><p class="sub" id="msg">Handing the sign-in back to the app on this computer.</p></div></div>
</main>
<script>
// Sign-in return page for HQ, the channel owner's private tool. It forwards the one-time code
// from TikTok to the setup script running on this same computer (127.0.0.1) and stores nothing.
(function () {
  var q = location.search || '';
  if (q.indexOf('code=') === -1 && q.indexOf('error=') === -1) {
    document.getElementById('msg').textContent = 'Nothing to connect. You can close this tab.';
    return;
  }
  location.replace('http://127.0.0.1:8798/tiktok' + q);
})();
</script>
</body>
</html>
